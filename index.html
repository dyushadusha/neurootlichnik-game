<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Найди 5 отличий — Нейро Отличник</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo-icon.svg" />

  <!-- Официальный SDK Telegram Mini Apps — даёт доступ к возможностям Telegram
       (вибрация, кнопки, подгонка под тему и т.д.). Вне Telegram просто грузится и не мешает. -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Свои шрифты бренда подключены прямо в src/style.css (папка assets/fonts) -->
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <header class="app-header">
    <div class="app-header__brand">
      <img class="app-header__logo-img" src="assets/logo-icon.svg" alt="Нейро Отличник" />
    </div>
    <a href="https://neurootlichnik.ru/" target="_blank" class="btn btn--outline">Сайт студии</a>
  </header>

  <main class="game">
    <p class="game__tagline">&gt; render_speed(thought)</p>

    <div class="game__meta">
      <div class="stat-card">
        <span class="stat-card__num accent-num" id="foundCount">0/5</span>
        <span class="stat-card__label">найдено</span>
      </div>
      <div class="stat-card">
        <span class="stat-card__num accent-num" id="timer">00:00</span>
        <span class="stat-card__label">время</span>
      </div>
    </div>

    <div class="game__images">
      <div class="game-image" data-image="a">
        <img alt="Рендер, вариант A" draggable="false" />
        <div class="hotspots-layer"></div>
      </div>
      <div class="game-image" data-image="b">
        <img alt="Рендер, вариант B" draggable="false" />
        <div class="hotspots-layer"></div>
      </div>
    </div>
  </main>

  <!-- Маскот: кнопка внизу экрана открывает карточку с фактом -->
  <button id="mascotBtn" class="mascot-btn" aria-label="Факт от Нейро Отличника">
    <img src="assets/mascot-avatar.webp" alt="" />
  </button>

  <div id="mascotBubble" class="mascot-bubble" hidden>
    <button class="mascot-bubble__close" id="mascotClose" aria-label="Закрыть">&times;</button>
    <p id="mascotFact" class="mascot-bubble__text"></p>
    <button class="btn btn--outline mascot-bubble__next" id="mascotNext">Ещё факт</button>
  </div>

  <div id="victoryScreen" class="victory-screen" hidden>
    <img class="victory-screen__mascot" src="assets/mascot-hero.webp" alt="Нейро Отличник рад за вас" />
    <img class="victory-screen__logo" src="assets/logo-full.svg" alt="Нейро Отличник" />
    <h2>Уровень пройден!</h2>
    <p>Ваше время: <span id="victoryTime" class="victory-screen__time accent-num">00:00</span></p>
    <div class="victory-screen__actions">
      <button class="btn" id="shareBtn">Поделиться результатом</button>
      <a class="btn btn--outline" href="https://neurootlichnik.ru/" target="_blank">
        Хочу такой же рендер для своего проекта
      </a>
    </div>
  </div>

  <script src="src/levels.js"></script>
  <script src="src/facts.js"></script>
  <script src="src/game.js"></script>
</body>
</html>
