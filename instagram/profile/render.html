<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Профиль — Нейро Отличник</title>
<!-- Аватар и макет всего профиля. Сначала должны быть отрисованы
     highlights/out и posts/out (npm run render-instagram делает всё по порядку). -->
<link rel="stylesheet" href="../brand.css" />
<style>
  body { background: #999; padding: 40px; font-family: sans-serif; }
  .row { display: flex; gap: 30px; flex-wrap: wrap; align-items: flex-start; }

  .ava { width: 1080px; height: 1080px; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; }
  .ava--lime { background: #dbfc3b; }
  .ava--lime img { width: 1000px; }
  .ava--dark { background: #2a2a2a; align-items: center; }
  .ava--dark .logo { width: 760px; }

  /* ---------- макет экрана профиля ---------- */
  .phone { width: 1170px; background: #fff; color: #000; font-family: -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; padding-bottom: 20px; }
  .bar { display: flex; align-items: center; justify-content: space-between; padding: 40px 44px 30px; font-size: 44px; font-weight: 700; }
  .head { display: flex; align-items: center; gap: 70px; padding: 10px 44px 30px; }
  .head__ava { width: 250px; height: 250px; border-radius: 50%; overflow: hidden; background: #dbfc3b; flex: none; }
  .head__ava { display: flex; align-items: flex-end; justify-content: center; }
  .head__ava img { width: 231px; flex: none; }
  .stats { display: flex; gap: 70px; text-align: center; font-size: 34px; }
  .stats b { display: block; font-size: 44px; }
  .bio { padding: 0 44px; font-size: 36px; line-height: 1.38; }
  .bio .name { font-weight: 700; }
  .bio .cat { color: #737373; }
  .bio .link { color: #00376b; font-weight: 600; }
  .btns { display: flex; gap: 14px; padding: 34px 44px; }
  .btns span { flex: 1; text-align: center; padding: 22px 0; border-radius: 20px; background: #efefef; font-size: 34px; font-weight: 600; }
  .btns span.primary { background: #0095f6; color: #fff; }
  .hls { display: flex; gap: 36px; padding: 10px 44px 40px; overflow: hidden; }
  .hl { flex: none; width: 190px; text-align: center; font-size: 30px; }
  .hl__ring { width: 190px; height: 190px; border-radius: 50%; border: 3px solid #dbdbdb; padding: 8px; }
  .hl__ring img { width: 100%; height: 100%; border-radius: 50%; display: block; }
  .hl div { margin-top: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tabs { display: flex; border-top: 1px solid #dbdbdb; }
  .tabs span { flex: 1; text-align: center; padding: 26px 0; font-size: 34px; color: #8e8e8e; }
  .tabs span:first-child { color: #000; border-bottom: 3px solid #000; }
  .feed { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .feed div { position: relative; aspect-ratio: 3 / 4; overflow: hidden; }
  .feed img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .feed .pin { position: absolute; top: 16px; right: 16px; font-size: 34px; filter: drop-shadow(0 0 6px rgba(0,0,0,.6)); }
</style>
</head>
<body>
<div id="app" class="row"></div>
<script src="../posts/data.js"></script>
<script src="../highlights/data.js"></script>
<script src="profile.js"></script>
<script>
  (async () => {
    const logo = (await (await fetch('../../assets/logo-icon.svg')).text())
      .replace(/\s(width|height)="[^"]*"/g, '').replace('<svg', '<svg style="width:100%;height:auto;display:block"');
    const bioHtml = PROFILE.bio.replace(/\n/g, '<br>');
    document.getElementById('app').innerHTML = `
      <div class="ava ava--lime" data-shot="avatar-mascot"><img src="../../assets/mascot-avatar.webp" alt=""></div>
      <div class="ava ava--dark" data-shot="avatar-logo"><div class="logo">${logo}</div></div>
      <div class="phone" data-shot="profile-mockup">
        <div class="bar"><span>${PROFILE.username}</span><span>☰</span></div>
        <div class="head">
          <div class="head__ava"><img src="../../assets/mascot-avatar.webp" alt=""></div>
          <div class="stats"><div><b>${POSTS.length}</b>публикаций</div><div><b>—</b>подписчиков</div><div><b>—</b>подписок</div></div>
        </div>
        <div class="bio">
          <div class="name">${PROFILE.name}</div>
          <div class="cat">${PROFILE.category}</div>
          <div>${bioHtml}</div>
          <div class="link">🔗 ${PROFILE.linkLabel}</div>
        </div>
        <div class="btns"><span class="primary">Написать</span><span>WhatsApp</span><span>Почта</span></div>
        <div class="hls">${HIGHLIGHTS.map(h => `<div class="hl"><div class="hl__ring"><img src="../highlights/out/covers/dark/${h.id}.png"></div><div>${h.name}</div></div>`).join('')}</div>
        <div class="tabs"><span>▦</span><span>▶</span><span>👤</span></div>
        <div class="feed">${POSTS.map(p => `<div><img src="../posts/out/${p.id}/01.jpg">${p.pin ? '<span class="pin">📌</span>' : ''}</div>`).join('')}</div>
      </div>`;
    await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
    await document.fonts.ready;
    document.body.dataset.ready = '1';
  })();
</script>
</body>
</html>
