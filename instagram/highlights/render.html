<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Актуальное — Нейро Отличник</title>
<!--
  Страница-«печатный станок» для Instagram: рисует обложки кружков,
  заставки сторис и превью профиля. Смотреть глазами:
    npm run dev → открыть /instagram/highlights/render.html
  Сохранить все картинки в PNG:
    npm run render-instagram   (см. tools/render-instagram.js)
-->
<link rel="stylesheet" href="../brand.css" />
<style>
  @font-face { font-family: 'InterTight'; src: url('../../assets/fonts/InterTightSemiBold.ttf'); font-weight: 600; }
  @font-face { font-family: 'KicaBold'; src: url('../../assets/fonts/KicaBold.ttf'); font-weight: 700; }
  @font-face { font-family: 'Pershotravneva'; src: url('../../assets/fonts/Pershotravneva55.ttf'); }

  :root { --graphite: #2a2a2a; --lime: #dbfc3b; --paper: #f5f5f0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #bbb; font-family: 'InterTight', sans-serif; padding: 40px; }
  h2 { font: 700 28px 'KicaBold'; margin: 40px 0 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 24px; }

  /* ---------- Обложка кружка ---------- */
  .cover {
    position: relative; width: 1080px; height: 1080px; overflow: hidden;
    background: var(--bg); color: var(--ink);
    display: flex; align-items: center; justify-content: center;
  }
  .cover.story { height: 1920px; }
  .cover__icon { width: 640px; height: 640px; }
  .cover__icon--wide { width: 800px; }
  .cover__icon svg { width: 100%; height: 100%; overflow: visible; }
  .cover__doodle { position: absolute; width: 120px; height: 120px; display: none; } /* дудлы в кружке на телефоне превращаются в «мусор» — выключены */
  .cover__doodle svg { width: 100%; height: 100%; }

  /* ---------- Заставка сторис (первый слайд каждого кружка) ---------- */
  .intro {
    position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: var(--graphite); color: var(--paper);
    display: flex; flex-direction: column; align-items: center;
  }
  .intro__logo { margin-top: 150px; width: 440px; }
  .intro__logo svg { width: 100%; height: auto; display: block; }
  .intro__num { margin-top: 90px; font: 44px 'Pershotravneva'; color: var(--lime); letter-spacing: 2px; }
  .intro__circle {
    margin-top: 30px; width: 520px; height: 520px; border-radius: 50%; overflow: hidden;
    border: 10px solid var(--paper); box-shadow: 18px 18px 0 var(--paper);
  }
  .intro__circle .cover { width: 100%; height: 100%; }
  .intro__circle .cover__icon { width: 300px; height: 300px; }
  .intro__circle .cover__icon--wide { width: 380px; }
  .intro__circle .cover__doodle { display: none; }
  .intro__title {
    margin-top: 90px; padding: 0 70px; text-align: center;
    font: 700 104px/1.05 'KicaBold'; color: var(--lime);
  }
  .intro__hook {
    margin-top: 44px; padding: 0 110px; text-align: center;
    font: 600 44px/1.35 'InterTight'; color: var(--paper); opacity: .88;
  }
  .intro__next {
    position: absolute; bottom: 380px; left: 0; right: 0; text-align: center;
    font: 56px 'Pershotravneva'; color: var(--lime);
  }
  .bg-doodle { position: absolute; opacity: .9; }
  .bg-doodle svg { width: 100%; height: 100%; }

  /* ---------- Финальный слайд-призыв (последний в каждом кружке) ---------- */
  .cta {
    position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: var(--lime); color: var(--graphite);
  }
  .cta__title { position: absolute; top: 260px; left: 80px; right: 80px; font: 700 118px/1.02 'KicaBold'; }
  .cta__text { position: absolute; top: 560px; left: 80px; right: 120px; font: 600 48px/1.35 'InterTight'; }
  .cta__btn {
    position: absolute; top: 820px; left: 80px; padding: 34px 56px;
    background: #fff; border: 8px solid var(--graphite); border-radius: 60px;
    box-shadow: 14px 14px 0 var(--graphite); font: 700 38px 'KicaBold'; white-space: nowrap;
  }
  .cta__hand { position: absolute; top: 1010px; left: 90px; font: 56px/1.1 'Pershotravneva'; width: 520px; }
  .cta__mascot { position: absolute; right: -90px; bottom: 0; height: 900px; }

  /* ---------- Превью профиля ---------- */
  .preview { width: 1080px; background: #fff; padding: 60px 40px 50px; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; color: #111; }
  .preview__head { display: flex; align-items: center; gap: 40px; padding: 0 10px 40px; }
  .preview__ava { width: 190px; height: 190px; border-radius: 50%; background: var(--lime); overflow: hidden; border: 4px solid #fff; outline: 4px solid #ddd; }
  .preview__ava img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .preview__nick { font-size: 44px; font-weight: 700; }
  .preview__bio { font-size: 30px; color: #444; margin-top: 10px; line-height: 1.35; }
  .preview__row { display: grid; grid-template-columns: repeat(5, 1fr); row-gap: 36px; }
  .hl { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .hl__ring { width: 170px; height: 170px; border-radius: 50%; border: 3px solid #dbdbdb; padding: 7px; }
  .hl__img { width: 100%; height: 100%; border-radius: 50%; overflow: hidden; }
  .hl__img .cover { transform: scale(calc(150 / 1080)); transform-origin: 0 0; }
  .hl__name { font-size: 26px; max-width: 190px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .preview__label { font: 700 30px 'KicaBold'; margin-bottom: 30px; padding-left: 10px; }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <!-- «Рисованная» дрожь линии — как у фирменных дудлов -->
      <filter id="wobble" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" />
        <feDisplacementMap in="SourceGraphic" scale="4" />
      </filter>
    </defs>
  </svg>

  <div id="app"></div>

<script src="data.js"></script>
<script src="icons.js"></script>
<script src="../engine.js"></script>
<script src="stories.js"></script>
<script>
  const ASSETS = '../../assets/';
  const svgCache = {};

  async function loadSvg(path) {
    if (!svgCache[path]) svgCache[path] = await (await fetch(ASSETS + path)).text();
    return svgCache[path];
  }
  // Фирменные svg нарисованы лаймом — перекрашиваем под нужный цвет
  const recolor = (svg, color) => svg.replace(/#dbfc3b/gi, color)
    .replace(/<svg([^>]*?)\s(width|height)="[^"]*"/, '<svg$1').replace(/<svg([^>]*?)\s(width|height)="[^"]*"/, '<svg$1')
    .replace('<svg', '<svg style="width:100%;height:100%;display:block"');

  function iconSvg(icon, ink, shadow, logoSvg) {
    if (icon === 'about') {
      // Логотип-очки: широкий, поэтому отдельная раскладка
      const logo = recolor(logoSvg, ink);
      const sh = shadow ? `<div style="position:absolute;inset:0;transform:translate(16px,16px)">${recolor(logoSvg, shadow)}</div>` : '';
      return `<div style="position:relative;width:100%;height:100%;display:flex;align-items:center">${sh}<div style="position:relative;width:100%">${logo}</div></div>`;
    }
    const g = (color, dx) => `<g transform="translate(${dx} ${dx})" style="color:${color}" fill="none" stroke="currentColor"
      stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#wobble)">${ICONS[icon]}</g>`;
    return `<svg viewBox="0 0 200 200">${shadow ? g(shadow, 5) : ''}${g(ink, 0)}</svg>`;
  }

  async function coverHtml(h, v, story = false, idPrefix = 'cover') {
    const V = VARIANTS[v];
    const logo = await loadSvg('logo-icon.svg');
    const doodle = recolor(await loadSvg(`doodles/${h.doodle}.svg`), V.shadow || V.ink);
    const top = story ? 590 : 150;
    return `<div class="cover ${story ? 'story' : ''}" id="${idPrefix}-${v}-${h.id}" style="--bg:${V.bg};--ink:${V.ink}">
      <div class="cover__icon${h.icon === 'about' ? ' cover__icon--wide' : ''}">${iconSvg(h.icon, V.ink, V.shadow, logo)}</div>
      <div class="cover__doodle" style="top:${top}px;left:790px">${doodle}</div>
    </div>`;
  }

  async function introHtml(h, i) {
    const logoFull = recolor(await loadSvg('logo-full.svg'), '#dbfc3b');
    const d = async (name, style) => `<div class="bg-doodle" style="${style}">${await loadSvg('doodles/' + name + '.svg')}</div>`;
    return `<div class="intro" id="intro-${h.id}">
      ${await d('spiral-b', 'top:560px;left:60px;width:110px;height:110px')}
      ${await d('zigzag', 'top:1540px;left:90px;width:130px;height:130px')}
      ${await d('cross-a', 'top:470px;right:120px;width:70px;height:70px')}
      <div class="intro__logo">${logoFull}</div>
      <div class="intro__num">${String(i + 1).padStart(2, '0')} / ${String(HIGHLIGHTS.length).padStart(2, '0')}</div>
      <div class="intro__circle">${await coverHtml(h, 'lime', false, 'x')}</div>
      <div class="intro__title">${h.title}</div>
      <div class="intro__hook">${h.hook}</div>
      <div class="intro__next">листайте →</div>
    </div>`;
  }

  async function ctaHtml() {
    const arrow = recolor(await loadSvg('doodles/arrow-curve.svg'), '#2a2a2a');
    const sparkle = recolor(await loadSvg('doodles/sparkle.svg'), '#2a2a2a');
    return `<div class="cta" id="cta">
      <div class="bg-doodle" style="top:150px;right:90px;width:120px;height:120px">${sparkle}</div>
      <div class="cta__title">Хотите<br>так же?</div>
      <div class="cta__text">Пришлите исходники, желаемый результат и срок — ${CONTACTS.manager} рассчитает проект</div>
      <div class="cta__btn">Telegram: ${CONTACTS.telegram}</div>
      <div class="cta__hand">или жмите на ссылку ниже</div>
      <div class="bg-doodle" style="top:1110px;left:200px;width:150px;height:150px;transform:rotate(100deg)">${arrow}</div>
      <img class="cta__mascot" src="${ASSETS}mascot-hero.webp" alt="">
    </div>`;
  }

  async function previewHtml(v) {
    const items = await Promise.all(HIGHLIGHTS.map(async h => `<div class="hl"><div class="hl__ring"><div class="hl__img">${await coverHtml(h, v, false, 'p')}</div></div><div class="hl__name">${h.name}</div></div>`));
    return `<div class="preview" id="preview-${v}">
      <div class="preview__head">
        <div class="preview__ava"><img src="${ASSETS}mascot-avatar.webp" alt=""></div>
        <div>
          <div class="preview__nick">neurootlichnik</div>
          <div class="preview__bio">Архитектурная нейровизуализация<br>ИИ-рендеры · обновление рендеров · AI-видео<br>Для архбюро, дизайнеров и девелоперов</div>
        </div>
      </div>
      <div class="preview__row">${items.join('')}</div>
    </div>`;
  }

  (async () => {
    await document.fonts.load('72px KicaBold');
    let out = '';
    out += '<h2>Превью профиля</h2><div class="row">';
    for (const v of Object.keys(VARIANTS)) out += await previewHtml(v);
    out += '</div>';
    for (const v of Object.keys(VARIANTS)) {
      out += `<h2>Обложки 1080×1080 — ${v}</h2><div class="row">`;
      for (const h of HIGHLIGHTS) out += await coverHtml(h, v);
      out += `</div><h2>Обложки 1080×1920 — ${v}</h2><div class="row">`;
      for (const h of HIGHLIGHTS) out += await coverHtml(h, v, true, 'story');
      out += '</div>';
    }
    out += '<h2>Заставки — первый слайд каждого кружка</h2><div class="row">';
    for (const [i, h] of HIGHLIGHTS.entries()) out += await introHtml(h, i);
    out += '</div><h2>Финальный слайд-призыв</h2><div class="row">' + await ctaHtml() + '</div>';
    // Полные наборы сторис для каждого кружка: заставка → слайды → призыв
    await IG.init();
    const cta = await ctaHtml();
    for (const [i, h] of HIGHLIGHTS.entries()) {
      const slides = STORIES[h.id] || [];
      const n = k => String(k).padStart(2, '0');
      out += `<h2>Сторис: ${h.name}</h2><div class="row">`;
      out += (await introHtml(h, i)).replace(`id="intro-${h.id}"`, `id="hs-${h.id}-01"`);
      slides.forEach((sl, k) => { out += IG.slide(sl, { id: `hs-${h.id}-${n(k + 2)}`, story: true }); });
      out += cta.replace('id="cta"', `id="hs-${h.id}-${n(slides.length + 2)}"`);
      out += '</div>';
    }
    document.getElementById('app').innerHTML = out;
    await Promise.all([...document.images].map(img => img.decode().catch(() => {})));
    await document.fonts.ready;
    document.body.dataset.ready = '1';
  })();
</script>
</body>
</html>
