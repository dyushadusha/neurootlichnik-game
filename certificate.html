<title>Сертификат Вайбхорсинг</title>
<style>
  :root{
    --ink:#0f0b08;
    --ink-2:#171009;
    --card:#1b130c;
    --card-edge:#3a2a17;
    --gold:#e7bd6b;
    --gold-soft:#c99f52;
    --ember:#d1652b;
    --cream:#f3ead9;
    --muted:#b6a58c;
    --hairline:rgba(231,189,107,0.28);
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(60% 50% at 20% 8%, rgba(209,101,43,0.16), transparent 60%),
      radial-gradient(70% 60% at 85% 95%, rgba(231,189,107,0.10), transparent 60%),
      var(--ink);
    color:var(--cream);
    font-family:"Manrope","Segoe UI",sans-serif;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:32px 16px 56px;
  }

  .wrap{
    width:100%;
    max-width:460px;
  }

  .card{
    position:relative;
    background:linear-gradient(175deg, var(--card) 0%, var(--ink-2) 100%);
    border:1px solid var(--card-edge);
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 30px 70px -30px rgba(0,0,0,0.7), 0 0 0 1px rgba(0,0,0,0.2);
  }

  @media (max-width:600px){
    body{
      padding:0;
      align-items:stretch;
      min-height:100dvh;
    }
    .wrap{
      max-width:none;
      min-height:100dvh;
      display:flex;
    }
    .card{
      flex:1;
      border-radius:0;
      border:none;
      box-shadow:none;
    }
    .card::before{
      display:none;
    }
  }

  .card::before{
    content:"";
    position:absolute;
    inset:10px;
    border:1px solid rgba(231,189,107,0.16);
    border-radius:14px;
    pointer-events:none;
    z-index:2;
  }

  .hero{
    position:relative;
  }

  .hero img{
    display:block;
    width:100%;
    aspect-ratio:4/5;
    object-fit:cover;
    object-position:26% 32%;
  }

  .hero::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(180deg,
      rgba(9,6,4,0.68) 0%,
      rgba(9,6,4,0.22) 24%,
      rgba(9,6,4,0) 42%,
      rgba(9,6,4,0) 64%,
      var(--card) 100%);
  }

  .mark{
    position:absolute;
    top:18px;
    left:20px;
    right:20px;
    display:flex;
    align-items:center;
    gap:10px;
    z-index:1;
  }

  .content{
    padding:22px 28px 30px;
  }

  .seal{
    width:34px;
    height:34px;
    display:block;
    flex:none;
  }

  .brand{
    font-size:12.5px;
    font-weight:700;
    letter-spacing:0.22em;
    color:var(--gold);
    text-transform:uppercase;
    line-height:1.3;
  }

  .tagline{
    margin-top:2px;
    font-size:9.5px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--muted);
  }

  .rule{
    height:1px;
    margin:20px 0;
    background:linear-gradient(90deg, transparent, var(--hairline) 20%, var(--hairline) 80%, transparent);
  }

  .title{
    font-family:"Oswald","Manrope",sans-serif;
    text-align:center;
    text-transform:uppercase;
    font-weight:600;
    font-size:clamp(34px,9vw,44px);
    line-height:1;
    letter-spacing:0.01em;
    text-wrap:balance;
    background:linear-gradient(180deg, #fbecc9, var(--gold) 60%, var(--gold-soft));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .subtitle{
    font-family:"Oswald","Manrope",sans-serif;
    text-align:center;
    text-transform:uppercase;
    font-weight:500;
    font-size:clamp(17px,4.6vw,20px);
    letter-spacing:0.04em;
    color:var(--cream);
    margin-top:6px;
  }

  .for-label{
    text-align:center;
    font-size:11.5px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--muted);
    margin-top:22px;
  }

  .recipient{
    font-family:"Oswald","Manrope",sans-serif;
    text-align:center;
    font-size:clamp(24px,6.2vw,30px);
    font-weight:500;
    color:var(--gold);
    margin-top:8px;
    text-wrap:balance;
  }

  .badge-row{
    display:flex;
    justify-content:center;
    margin-top:20px;
  }

  .badge{
    display:inline-block;
    padding:9px 22px;
    border-radius:999px;
    background:linear-gradient(180deg, #f2d693, var(--gold-soft));
    color:#241505;
    font-family:"Oswald","Manrope",sans-serif;
    font-weight:600;
    font-size:15px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    box-shadow:0 6px 18px -6px rgba(231,189,107,0.5);
  }

  .details{
    margin-top:22px;
    display:flex;
    flex-direction:column;
  }

  .detail{
    display:flex;
    gap:13px;
    align-items:flex-start;
    padding:14px 2px;
    border-top:1px solid var(--hairline);
  }

  .detail:last-child{
    border-bottom:1px solid var(--hairline);
  }

  .detail svg{
    flex:none;
    width:19px;
    height:19px;
    margin-top:1px;
    color:var(--gold);
  }

  .detail p{
    margin:0;
    font-size:14.5px;
    line-height:1.45;
    color:var(--cream);
  }

  .detail p b{
    color:var(--gold);
    font-weight:600;
  }

  .footer{
    margin-top:26px;
    text-align:center;
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--muted);
  }
</style>
