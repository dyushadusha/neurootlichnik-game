<!DOCTYPE html>
<!--
  ===========================================================================
  КАЛЬКУЛЯТОР СТОИМОСТИ — «Нейро Отличник»
  ===========================================================================
  Самодостаточный файл — пошаговый визард с живым расчётом цены. Ничего не
  подгружается из этого репозитория. Шрифты (Kica Bold, Pershotravneva55) и
  лого — напрямую с neurootlichnik.ru (те же файлы, что и сам сайт), маскот —
  встроен как base64 (тот же файл, что в игре).

  Разместить можно так:
    А) отдельная html-страница (например, на Vercel вместе с игрой);
    Б) блок «свой код» / embed на Taptop — тогда калькулятор откроется
       прямо на neurootlichnik.ru. Если виджет просит только <body> —
       скопируйте всё начиная с "НАЧАЛО ВИДИМОЙ ЧАСТИ" и до конца файла.

  ЧТО ПОПРАВИТЬ ПЕРЕД ПУБЛИКАЦИЕЙ:
    1. Блок PRICING в начале <script> — черновые цены, поправьте на свои.
    2. SUBMIT_ENDPOINT там же — адрес функции из api/submit-brief.js.
  ===========================================================================
-->
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Калькулятор стоимости визуализации — Нейро Отличник</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  @font-face{font-family:'Kica Bold';font-weight:600;font-style:normal;font-display:swap;
    src:url('https://neurootlichnik.ru/t/images/mosaic/fonts/Kica%20Bold-600-normal-1.ttf') format('truetype');}
  @font-face{font-family:'Kica Bold';font-weight:700;font-style:normal;font-display:swap;
    src:url('https://neurootlichnik.ru/t/images/mosaic/fonts/Kica%20Bold-600-normal-1.ttf') format('truetype');}
  @font-face{font-family:'Pershotravneva55';font-weight:400;font-style:normal;font-display:swap;
    src:url('https://neurootlichnik.ru/t/images/mosaic/fonts/Pershotravneva55-400-normal-1.ttf') format('truetype');}

  :root{
    --bg:#fdfff7;
    --card:#ffffff;
    --ink:#2a2a2a;
    --text:#2a2a2a;
    --text-muted:#5d5d5d;
    --accent:#d3fd00;
    --accent-hover:#a9d32a;
    --accent-contrast:#2a2a2a;
    --border:#2a2a2a;
    --bw:3px;
    --shadow:5px 5px 0 var(--ink);
    --shadow-sm:3px 3px 0 var(--ink);
    --font-sans:'Inter Tight', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-display:'Kica Bold', var(--font-sans);
    --font-hand:'Pershotravneva55', cursive, var(--font-sans);
    --radius:18px 24px 16px 22px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--bg);}
  body{
    font-family:var(--font-sans);color:var(--text);line-height:1.5;
    padding-bottom:112px;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  }

  /* ---------- Дудлы на весь фон страницы (только лаймовые) ---------- */
  .doodle-field{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
  .doodle{position:absolute;color:var(--accent);opacity:.55;animation-name:doodle-float;animation-timing-function:ease-in-out;animation-iteration-count:infinite;}
  @keyframes doodle-float{
    0%,100%{transform:translateY(0) rotate(-6deg) scale(1);}
    50%{transform:translateY(-18px) rotate(10deg) scale(1.07);}
  }

  .page{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:20px 16px 40px;}

  /* ---------- Анимации ---------- */
  @keyframes rise-in{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
  @keyframes logo-pop{from{opacity:0;transform:scale(.6) rotate(-10deg);}60%{opacity:1;transform:scale(1.08) rotate(3deg);}to{opacity:1;transform:scale(1) rotate(0);}}
  @keyframes bar-slide-up{from{transform:translateY(100%);}to{transform:translateY(0);}}
  @keyframes pop-bounce{0%{transform:scale(1) rotate(0);}35%{transform:scale(1.06) rotate(-1deg);}65%{transform:scale(.98) rotate(.5deg);}100%{transform:scale(1) rotate(0);}}
  @keyframes price-bump{0%{transform:scale(1);}40%{transform:scale(1.14);}100%{transform:scale(1);}}
  @keyframes confetti-fall{
    from{transform:translateY(-10px) rotate(0deg);opacity:1;}
    to{transform:translateY(100vh) rotate(360deg);opacity:.2;}
  }
  @keyframes mascot-bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
  @media (prefers-reduced-motion: reduce){
    .doodle,.step-card,.price-bar,.brief-header__logo,.mascot-avatar{animation:none !important;}
    .option-card.pop,.price-bar__value.bump,.confetti-piece{animation:none !important;}
    .step-card{opacity:1 !important;transform:none !important;}
  }

  /* ---------- Шапка ---------- */
  .brief-header{text-align:center;margin-bottom:18px;}
  .brief-header__brand{display:inline-flex;align-items:center;gap:10px;margin-bottom:10px;}
  .brief-header__logo{display:inline-flex;width:42px;height:15px;color:var(--accent-contrast);
    animation:logo-pop .7s cubic-bezier(.34,1.56,.64,1) both;filter:drop-shadow(1.5px 1.5px 0 var(--accent));}
  .brief-header__logo svg{display:block;width:100%;height:100%;}
  .brief-header__wordmark{font-family:var(--font-display);font-weight:700;font-size:15px;}
  .brief-header h1{font-family:var(--font-hand);font-weight:400;font-size:clamp(24px,6vw,32px);line-height:1.2;text-wrap:balance;}
  .brief-header p{color:var(--text-muted);font-size:14px;max-width:420px;margin:6px auto 0;}

  /* ---------- Прогресс ---------- */
  .progress-wrap{margin-bottom:16px;}
  .progress-track{height:8px;border:2px solid var(--border);border-radius:999px;background:var(--card);overflow:hidden;}
  .progress-fill{height:100%;background:var(--accent);width:0%;transition:width .35s cubic-bezier(.3,1,.5,1);}
  .progress-label{font-size:12px;color:var(--text-muted);text-align:center;margin-top:6px;}

  /* ---------- Карточка шага ---------- */
  #wizard{position:relative;}
  .step-card{
    background:var(--card);border:var(--bw) solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:22px 20px;margin-bottom:16px;
    animation:rise-in .4s ease-out both;
  }
  .step-title{font-family:var(--font-display);font-weight:600;font-size:19px;margin-bottom:16px;text-wrap:balance;}
  .step-note{font-size:13px;color:var(--text-muted);margin-top:10px;}
  .field-block{margin-bottom:18px;}
  .field-block:last-child{margin-bottom:0;}
  .field-block__label{font-family:var(--font-display);font-weight:600;font-size:14px;margin-bottom:10px;}

  .wizard-nav{display:flex;gap:10px;}
  .wizard-nav button{
    font-family:var(--font-display);font-weight:700;font-size:14px;cursor:pointer;
    border:var(--bw) solid var(--border);border-radius:14px 18px 14px 18px;
    padding:13px 18px;transition:background .15s ease,transform .1s ease;box-shadow:var(--shadow-sm);
  }
  .wizard-nav button:active{transform:translate(2px,2px);box-shadow:none;}
  #backBtn{background:var(--bg);color:var(--ink);flex:0 0 auto;}
  #backBtn:disabled{opacity:.35;cursor:not-allowed;}
  #nextBtn{background:var(--accent);color:var(--accent-contrast);flex:1 1 auto;}
  #nextBtn:hover{background:var(--accent-hover);}
  #nextBtn:disabled{opacity:.6;cursor:progress;}

  /* ---------- Карточки-варианты ---------- */
  .option-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media (max-width:420px){.option-grid{grid-template-columns:1fr;}}
  .option-card{
    position:relative;cursor:pointer;border:var(--bw) solid var(--border);border-radius:14px 18px 12px 16px;
    padding:12px 14px;background:var(--bg);transition:transform .15s ease,box-shadow .15s ease,background .15s ease;
  }
  .option-card input{position:absolute;opacity:0;width:1px;height:1px;}
  .option-card__title{font-family:var(--font-display);font-weight:600;font-size:14px;}
  .option-card__sub{font-size:12px;color:var(--text-muted);margin-top:2px;}
  .option-card.is-checked{background:var(--accent);box-shadow:var(--shadow-sm);}
  .option-card.is-checked .option-card__sub{color:color-mix(in srgb, var(--accent-contrast) 65%, transparent);}
  .option-card:hover{transform:translateY(-2px);}
  .option-card:active{transform:translate(2px,2px);}
  .option-card.pop{animation:pop-bounce .4s ease;}

  /* ---------- Степпер ---------- */
  .stepper{display:flex;align-items:center;gap:14px;margin-top:10px;}
  .stepper button{
    width:38px;height:38px;border-radius:10px;border:var(--bw) solid var(--border);
    background:var(--bg);font-family:var(--font-display);font-size:18px;font-weight:700;cursor:pointer;transition:transform .1s ease;
  }
  .stepper button:hover{background:var(--accent);}
  .stepper button:active{transform:translate(2px,2px);}
  .stepper__value{font-family:var(--font-display);font-size:20px;font-weight:700;min-width:34px;text-align:center;font-variant-numeric:tabular-nums;}
  .stepper__label{font-size:13px;color:var(--text-muted);}

  /* ---------- Плёнка кадров (визуальная обратная связь) ---------- */
  .filmstrip{display:flex;gap:4px;flex-wrap:wrap;}
  .filmstrip__frame{width:20px;height:14px;border:2px solid var(--border);border-radius:3px;background:var(--accent);}
  .filmstrip__more{font-family:var(--font-display);font-size:12px;align-self:center;color:var(--text-muted);}

  /* ---------- Ползунок сроков ---------- */
  .range-slider{width:100%;height:10px;border-radius:999px;background:var(--bg);border:2px solid var(--border);appearance:none;-webkit-appearance:none;}
  .range-slider::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--accent);border:var(--bw) solid var(--border);cursor:pointer;box-shadow:var(--shadow-sm);}
  .range-slider::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--accent);border:var(--bw) solid var(--border);cursor:pointer;box-shadow:var(--shadow-sm);}
  .range-slider__value{font-family:var(--font-display);font-weight:700;font-size:16px;text-align:center;margin-top:12px;}

  /* ---------- Поля ввода ---------- */
  .field{margin-bottom:12px;}
  .field:last-child{margin-bottom:0;}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;}
  .field input[type='text'],.field input[type='email'],.field textarea{
    width:100%;border:2px solid var(--border);border-radius:10px;padding:11px 12px;
    font-family:var(--font-sans);font-size:15px;color:var(--text);background:var(--bg);
  }
  .field textarea{resize:vertical;min-height:70px;}
  .field input:focus,.field textarea:focus{outline:2px solid var(--accent-hover);outline-offset:1px;}
  .field--required label::after{content:' *';color:#c0392b;}
  .hp-field{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;}
  .field-error{color:#c0392b;font-size:12px;margin-top:10px;display:none;}
  .field-error.is-visible{display:block;}

  /* ---------- Маскот ---------- */
  .mascot-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:16px;}
  .mascot-avatar{
    flex-shrink:0;width:52px;height:52px;border-radius:50%;border:var(--bw) solid var(--border);
    background:var(--accent);cursor:pointer;overflow:hidden;box-shadow:var(--shadow-sm);
    animation:mascot-bob 3s ease-in-out infinite;
  }
  .mascot-avatar img{width:100%;height:100%;object-fit:cover;pointer-events:none;}
  #mascotBubble{
    flex:1;min-width:0;background:var(--card);border:var(--bw) solid var(--border);border-radius:16px 20px 14px 18px;
    box-shadow:var(--shadow-sm);padding:10px 14px;font-size:13px;color:var(--text);position:relative;
  }
  #mascotBubble.pop{animation:pop-bounce .4s ease;}
  #mascotBubble::before{
    content:'';position:absolute;left:-8px;top:16px;border:8px solid transparent;border-right-color:var(--border);
  }
  #mascotBubble::after{
    content:'';position:absolute;left:-5px;top:16px;border:7px solid transparent;border-right-color:var(--card);
  }

  /* ---------- Мьют-кнопка ---------- */
  #muteBtn{
    position:absolute;top:20px;right:16px;width:34px;height:34px;border-radius:50%;
    border:2px solid var(--border);background:var(--card);cursor:pointer;font-size:14px;z-index:2;
  }
  #muteBtn.is-muted{opacity:.5;}

  /* ---------- Липкая панель с ценой ---------- */
  .price-bar{
    position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--bg);border-top:var(--bw) solid var(--border);
    box-shadow:0 -4px 0 rgba(0,0,0,.03);padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    animation:bar-slide-up .5s cubic-bezier(.3,1,.5,1) both;
  }
  .price-bar__inner{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:14px;}
  .price-bar__estimate{flex:1;min-width:0;}
  .price-bar__label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.03em;}
  .price-bar__value{display:inline-block;font-family:var(--font-display);font-weight:700;font-size:clamp(14px,4.2vw,19px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .price-bar__value span{background:var(--accent);padding:1px 6px;border-radius:6px;display:inline-block;}
  .price-bar__value.bump span{animation:price-bump .35s ease;}

  /* ---------- Результат ---------- */
  .result-screen{display:none;text-align:center;padding:40px 16px;position:relative;overflow:hidden;}
  .result-screen.is-visible{display:block;animation:rise-in .5s ease-out both;}
  .result-screen__icon{font-size:44px;margin-bottom:12px;}
  .result-screen h2{font-family:var(--font-hand);font-weight:400;font-size:28px;margin-bottom:10px;}
  .result-screen p{color:var(--text-muted);font-size:14px;max-width:420px;margin:0 auto 16px;}
  .result-summary{text-align:left;max-width:480px;margin:0 auto 16px;border:var(--bw) solid var(--border);border-radius:var(--radius);padding:14px;background:var(--card);box-shadow:var(--shadow-sm);}
  .result-summary textarea{width:100%;min-height:160px;border:none;font-family:monospace;font-size:12.5px;color:var(--text);resize:vertical;background:transparent;}
  .result-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .btn-outline{
    font-family:var(--font-display);font-weight:600;font-size:13px;padding:11px 18px;border:var(--bw) solid var(--border);
    border-radius:12px;background:var(--bg);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block;transition:transform .1s ease;
  }
  .btn-outline:hover{background:var(--accent);}
  .btn-outline:active{transform:translate(2px,2px);}

  /* ---------- Конфетти ---------- */
  #confettiHost{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60;}
  .confetti-piece{position:absolute;top:-10px;width:9px;height:9px;border:1.5px solid var(--ink);animation-name:confetti-fall;animation-timing-function:cubic-bezier(.25,.46,.45,.94);}
</style>
</head>

<script>
(function () {
  'use strict';

  /* =========================================================================
     PRICING — ЧЕРНОВЫЕ цены и коэффициенты (в рублях). Правьте цифры —
     остальной код трогать не нужно. Структура: одна ветка формы на каждое
     направление услуг.
     ========================================================================= */
  var PRICING = {
    // --- Ветка A: классический рендер (интерьер/экстерьер/генплан) ---
    a: {
      typology: {
        interior: {
          label: 'Интерьер',
          options: {
            flat:   { label: 'Квартира', base: 13000 },
            house:  { label: 'Частный дом', base: 15000 },
            office: { label: 'Офис', base: 14000 },
            retail: { label: 'Ритейл / магазин', base: 15000 },
            cafe:   { label: 'Кафе / ресторан', base: 16000 },
            public: { label: 'Общественное пространство', base: 18000 }
          },
          checklist: [
            { key: 'furniture', label: 'Сложная кастомная мебель / декор', add: 0.08 },
            { key: 'materials', label: 'Много разных материалов и фактур', add: 0.07 },
            { key: 'lighting',  label: 'Нестандартный свет (вечер, акценты)', add: 0.06 },
            { key: 'scale',     label: 'Большая площадь / несколько помещений в кадре', add: 0.09 }
          ]
        },
        exterior: {
          label: 'Экстерьер / фасад',
          options: {
            house:   { label: 'Частный дом', base: 16000 },
            mkd:     { label: 'Многоквартирный дом', base: 20000 },
            commerce:{ label: 'Коммерческое здание', base: 21000 },
            industry:{ label: 'Промышленный объект', base: 19000 }
          },
          checklist: [
            { key: 'facade',    label: 'Сложный фасад (много материалов/фактур)', add: 0.08 },
            { key: 'landscape', label: 'Ландшафт и благоустройство вокруг здания', add: 0.07 },
            { key: 'lighting',  label: 'Нестандартное освещение (вечер, подсветка)', add: 0.07 },
            { key: 'scale',     label: 'Крупный объект / несколько корпусов', add: 0.1 }
          ]
        },
        landscape: {
          label: 'Генплан / ландшафт',
          options: {
            block:  { label: 'Жилой квартал (генплан)', base: 22000 },
            public: { label: 'Общественное пространство', base: 20000 },
            plot:   { label: 'Ландшафт частной территории', base: 16000 }
          },
          checklist: [
            { key: 'amenities', label: 'Сложное благоустройство (МАФ, дорожки, озеленение)', add: 0.08 },
            { key: 'relief',    label: 'Рельеф / перепады высот', add: 0.07 },
            { key: 'zones',     label: 'Много разных зон и функций на плане', add: 0.08 },
            { key: 'lighting',  label: 'Вечерняя визуализация с освещением', add: 0.06 }
          ]
        }
      },
      extraFrameFactor: 0.65,
      sourceData: {
        model3d:  { label: 'Есть 3D-модель / чертежи', mult: 0.9 },
        sketches: { label: 'Есть только эскизы / план', mult: 1 },
        nothing:  { label: 'Ничего нет, только описание', mult: 1.3 }
      },
      closeupPrice: 4000,
      extraRevisionPrice: 2000
    },

    // --- Ветка B: улучшение готовых рендеров/скриншотов ---
    b: {
      source: {
        render:     { label: 'Готовый рендер', base: 8000 },
        screenshot: { label: 'Скриншот черновой 3D-модели (Archicad, SketchUp и т.п.)', base: 9000 },
        photo:      { label: 'Фото объекта', base: 10000 }
      },
      checklist: [
        { key: 'light',    label: 'Свет и атмосфера' },
        { key: 'landscape',label: 'Благоустройство и озеленение' },
        { key: 'people',   label: 'Люди и стаффаж' },
        { key: 'materials',label: 'Материалы и текстуры' },
        { key: 'sky',      label: 'Небо и фон' },
        { key: 'detail',   label: 'Общая детализация' }
      ],
      checklistItemPrice: 3000,
      extraFrameFactor: 0.6
    },

    // --- Ветка C: концепция и дизайн ---
    c: {
      subtype: {
        facade: { label: 'Фасад здания', base: 18000 },
        maf:    { label: 'МАФ / малый архитектурный объект', base: 12000 },
        public: { label: 'Общественное пространство', base: 22000 },
        other:  { label: 'Другое', base: 16000 }
      },
      stage: {
        sketch:   { label: 'Скетч-варианты (быстро, для выбора направления)', mult: 0.7 },
        detailed: { label: 'Детальная концепция с материалами', mult: 1.3 }
      }
    },

    // --- Ветка D: видео / motion ---
    d: {
      format: {
        presentation: { label: 'Презентационный клип из готовых рендеров', perSecond: 2200 },
        flythrough:   { label: 'Облёт по 3D-сцене с анимацией камеры', perSecond: 3200 }
      },
      minDuration: 15,
      sourceFrameIncluded: 3,
      sourceFramePrice: 1200
    },

    // --- Сроки (общий слайдер) ---
    timeline: {
      minDays: 2,
      maxDays: 21,
      neutralDays: 12, // от этого срока и дальше — без наценки за срочность
      maxRushMult: 1.6
    },

    estimateSpreadPct: 0.15,
    roundTo: 500
  };

  function round(n, step) { return Math.round(n / step) * step; }

  function timelineMult(days) {
    var t = PRICING.timeline;
    if (days >= t.neutralDays) return 1;
    var span = t.neutralDays - t.minDays;
    var extra = t.maxRushMult - 1;
    var frac = (t.neutralDays - days) / span;
    return 1 + extra * frac;
  }

  /* =========================================================================
     STATE
     ========================================================================= */
  var state = {
    branch: null, // 'a' | 'b' | 'c' | 'd'
    a: { subtype: 'interior', typology: 'flat', checklist: [], frames: 1, source: 'sketches', closeups: 0, extraRevisions: 0 },
    b: { source: 'render', frames: 1, checklist: [] },
    c: { subtype: 'facade', variants: 2, stage: 'sketch' },
    d: { format: 'presentation', duration: 15, sourceFrames: 3 },
    timelineDays: 10,
    name: '', contact: '', email: '', comment: '', website: ''
  };

  /* =========================================================================
     PRICE CALCULATION
     ========================================================================= */
  function calcEstimate() {
    var total = 0;

    if (state.branch === 'a') {
      var cfgA = PRICING.a;
      var typ = cfgA.typology[state.a.subtype];
      var opt = typ.options[state.a.typology];
      var base = opt.base * (1 + Math.max(0, state.a.frames - 1) * cfgA.extraFrameFactor);
      var checklistMult = 1;
      typ.checklist.forEach(function (item) {
        if (state.a.checklist.indexOf(item.key) !== -1) checklistMult += item.add;
      });
      total = base * checklistMult * cfgA.sourceData[state.a.source].mult;
      total += state.a.closeups * cfgA.closeupPrice;
      total += state.a.extraRevisions * cfgA.extraRevisionPrice;
    } else if (state.branch === 'b') {
      var cfgB = PRICING.b;
      var srcBase = cfgB.source[state.b.source].base;
      var framesTotal = srcBase * (1 + Math.max(0, state.b.frames - 1) * cfgB.extraFrameFactor);
      total = framesTotal + state.b.checklist.length * cfgB.checklistItemPrice;
    } else if (state.branch === 'c') {
      var cfgC = PRICING.c;
      var sub = cfgC.subtype[state.c.subtype];
      total = sub.base * state.c.variants * cfgC.stage[state.c.stage].mult;
    } else if (state.branch === 'd') {
      var cfgD = PRICING.d;
      var fmt = cfgD.format[state.d.format];
      var dur = Math.max(state.d.duration, cfgD.minDuration);
      total = fmt.perSecond * dur;
      if (state.d.format === 'presentation') {
        var extraFrames = Math.max(0, state.d.sourceFrames - cfgD.sourceFrameIncluded);
        total += extraFrames * cfgD.sourceFramePrice;
      }
    } else {
      return null;
    }

    total *= timelineMult(state.timelineDays);

    var low = round(total * (1 - PRICING.estimateSpreadPct), PRICING.roundTo);
    var high = round(total * (1 + PRICING.estimateSpreadPct), PRICING.roundTo);
    return { low: low, high: high };
  }

  function formatMoney(n) { return n.toLocaleString('ru-RU') + ' ₽'; }

  /* =========================================================================
     ЗВУК — короткие синтезированные тоны (Web Audio API), без файлов.
     Портировано из src/audio.js игры. Молчит, пока пользователь не нажал
     мьют-кнопку выключения — звук включён по умолчанию, но очень тихий.
     ========================================================================= */
  var SoundFX = (function () {
    var ctx = null;
    var enabled = true;

    function ensureCtx() {
      if (!ctx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC();
      }
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    }

    function tone(freqs, duration, type) {
      if (!enabled) return;
      var c = ensureCtx();
      if (!c) return;
      var now = c.currentTime;
      freqs.forEach(function (freq, i) {
        var osc = c.createOscillator();
        var gain = c.createGain();
        osc.type = type || 'sine';
        osc.frequency.value = freq;
        var start = now + i * (duration / freqs.length);
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(0.06, start + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.001, start + duration / freqs.length);

      });

  var stepRoot, progressFill, progressLabel, mascotBubbleText, backBtn, nextBtn;

  function renderStep() {
    var seq = currentSequence();
    if (stepIndex >= seq.length) stepIndex = seq.length - 1;
    var id = seq[stepIndex];
    var def = STEPS[id];

    stepRoot.innerHTML = '<h2 class="step-title">' + def.title + '</h2>' + def.render();
    def.bind(stepRoot);

    if (state.branch) {
      var pct = Math.round(((stepIndex + 1) / seq.length) * 100);
      progressFill.style.width = pct + '%';
      progressLabel.textContent = 'Шаг ' + (stepIndex + 1) + ' из ' + seq.length;
    } else {
      progressFill.style.width = '6%';
      progressLabel.textContent = 'Выберите направление, чтобы начать';
    }

    setMascotTip(id);
    backBtn.disabled = stepIndex === 0;
    nextBtn.textContent = (id === 'contacts') ? 'Отправить заявку' : 'Далее';

    updatePriceBar();
    stepRoot.classList.remove('rise');
    void stepRoot.offsetWidth;
    stepRoot.classList.add('rise');
  }

  function setMascotTip(stepId) {
    var tip = MASCOT_TIPS[stepId];
    if (!tip) {
      tip = MASCOT_GENERAL[mascotFactIndex % MASCOT_GENERAL.length];
      mascotFactIndex++;
    }
    mascotBubbleText.textContent = tip;
  }

  function goNext() {
    var seq = currentSequence();
    var id = seq[stepIndex];
    if (id === 'contacts') {
      submitForm();
      return;
    }
    if (!STEPS[id].canProceed()) return;
    SoundFX.click();
    if (stepIndex < seq.length - 1) {
      stepIndex++;
      renderStep();
    }
  }

  function goBack() {
    if (stepIndex > 0) {
      SoundFX.click();
      stepIndex--;
      renderStep();
    }
  }

      return;

    valueEl.classList.remove('bump');
    void valueEl.offsetWidth;
    valueEl.classList.add('bump');
  }

      var typA = PRICING.a.typology[state.a.subtype];
      var optA = typA.options[state.a.typology];
      lines.push('Услуга: Рендер — ' + typA.label + ' (' + optA.label + ')');
      lines.push('Ракурсов: ' + state.a.frames);
      if (state.a.checklist.length) {
        lines.push('Особенности: ' + state.a.checklist.map(function (k) {
          var item = typA.checklist.filter(function (i) { return i.key === k; })[0];
          return item ? item.label : k;
        }).join(', '));
      }
      lines.push('Исходные данные: ' + PRICING.a.sourceData[state.a.source].label);
      if (state.a.closeups) lines.push('Клоузапы: ' + state.a.closeups);
      if (state.a.extraRevisions) lines.push('Доп. правок: ' + state.a.extraRevisions);
    } else if (state.branch === 'b') {
      lines.push('Услуга: Улучшение готового материала — ' + PRICING.b.source[state.b.source].label);
      lines.push('Кадров: ' + state.b.frames);
      if (state.b.checklist.length) {
        lines.push('Улучшить: ' + state.b.checklist.map(function (k) {
          var item = PRICING.b.checklist.filter(function (i) { return i.key === k; })[0];
          return item ? item.label : k;
        }).join(', '));
      }
    } else if (state.branch === 'c') {
      lines.push('Услуга: Концепция и дизайн — ' + PRICING.c.subtype[state.c.subtype].label);
      lines.push('Вариантов: ' + state.c.variants);
      lines.push('Стадия: ' + PRICING.c.stage[state.c.stage].label);
    } else if (state.branch === 'd') {
      lines.push('Услуга: Видео/motion — ' + PRICING.d.format[state.d.format].label);
      lines.push('Длительность: ' + state.d.duration + ' сек');
      if (state.d.format === 'presentation') lines.push('Исходных кадров: ' + state.d.sourceFrames);
    }
    lines.push('Сроки: ' + timelineLabel(state.timelineDays));
    lines.push('Оценка: ' + formatMoney(estimate.low) + ' – ' + formatMoney(estimate.high));
    lines.push('');
    lines.push('Имя: ' + state.name.trim());
    lines.push('Контакт: ' + state.contact.trim());
    if (state.email.trim()) lines.push('Email: ' + state.email.trim());
    if (state.comment.trim()) lines.push('Комментарий: ' + state.comment.trim());
    return lines.join('\n');
  }

  function submitForm() {
    var errorEl = document.getElementById('formError');
    var name = state.name.trim();
    var contact = state.contact.trim();
    if (!name || !contact) {
      if (errorEl) {
        errorEl.textContent = 'Заполните, пожалуйста, имя и телефон/Telegram — иначе мы не сможем с вами связаться.';
        errorEl.classList.add('is-visible');
      }
      return;
    }

    var estimate = calcEstimate();
    var summaryText = buildSummaryText(estimate);
    var payload = {
      branch: state.branch,
      details: state,
      estimateLow: estimate.low,
      estimateHigh: estimate.high,
      name: name,
      contact: contact,
      email: state.email.trim(),
      comment: state.comment.trim(),
      website: state.website,
      summaryText: summaryText
    };

    nextBtn.disabled = true;
    nextBtn.textContent = 'Отправляем…';

    var finish = function (mode) { showResult(mode, summaryText, estimate); };

    if (!SUBMIT_ENDPOINT) {
      finish('fallback');
      return;
    }

    fetch(SUBMIT_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(function (res) {
      if (!res.ok) throw new Error('bad status');
      finish('sent');
    }).catch(function () {
      finish('fallback');
    }).finally(function () {
      nextBtn.disabled = false;
      nextBtn.textContent = 'Отправить заявку';
    });
  }

  function showResult(mode, summaryText, estimate) {
    document.getElementById('wizard').style.display = 'none';
    document.getElementById('priceBar').style.display = 'none';
    var screen = document.getElementById('resultScreen');
    screen.classList.add('is-visible');
    SoundFX.success();
    spawnConfetti();

    var title = document.getElementById('resultTitle');
    var text = document.getElementById('resultText');
    var summaryBlock = document.getElementById('resultSummaryBlock');
    var actions = document.getElementById('resultActions');
    actions.innerHTML = '';

    if (mode === 'sent') {
      title.textContent = 'Заявка отправлена!';
      text.textContent = 'Мы получили расчёт и скоро свяжемся с вами, чтобы уточнить детали проекта.';
      summaryBlock.style.display = 'none';
    } else {
      title.textContent = 'Заявку не удалось отправить автоматически';
      text.textContent = 'Скопируйте расчёт ниже и отправьте его нам в Telegram или на почту — мы обязательно ответим.';
      summaryBlock.style.display = '';
      document.getElementById('resultSummary').value = summaryText;

      var copyBtn = document.createElement('button');
      copyBtn.type = 'button';
      copyBtn.className = 'btn-outline';
      copyBtn.textContent = 'Скопировать текст';
      copyBtn.addEventListener('click', function () {
        var ta = document.getElementById('resultSummary');
        ta.select();
        document.execCommand('copy');
        copyBtn.textContent = 'Скопировано!';
        setTimeout(function () { copyBtn.textContent = 'Скопировать текст'; }, 1500);
      });
      actions.appendChild(copyBtn);

      var siteLink = document.createElement('a');
      siteLink.className = 'btn-outline';
      siteLink.href = 'https://neurootlichnik.ru/';
      siteLink.target = '_blank';
      siteLink.rel = 'noopener';
      siteLink.textContent = 'Написать студии';
      actions.appendChild(siteLink);
    }

    if (navigator.share) {
      var shareBtn = document.createElement('button');
      shareBtn.type = 'button';
      shareBtn.className = 'btn-outline';
      shareBtn.textContent = 'Поделиться расчётом';
      shareBtn.addEventListener('click', function () {
        navigator.share({ title: 'Нейро Отличник — расчёт стоимости', text: summaryText }).catch(function () {});
      });
      actions.appendChild(shareBtn);
    }
  }

  function spawnConfetti() {
    var host = document.getElementById('confettiHost');
    if (!host) return;
    var colors = ['var(--accent)', 'var(--ink)'];
    for (var i = 0; i < 28; i++) {
      var piece = document.createElement('span');
      piece.className = 'confetti-piece';
      piece.style.left = (Math.random() * 100) + '%';
      piece.style.background = colors[i % 2];
      piece.style.animationDelay = (Math.random() * 0.3) + 's';
      piece.style.animationDuration = (1.6 + Math.random() * 1) + 's';
      piece.style.transform = 'rotate(' + Math.floor(Math.random() * 360) + 'deg)';
      host.appendChild(piece);
    }
    setTimeout(function () { host.innerHTML = ''; }, 3200);
  }

  /* =========================================================================
     ИНИЦИАЛИЗАЦИЯ
     ========================================================================= */
  document.addEventListener('DOMContentLoaded', function () {
    stepRoot = document.getElementById('stepRoot');
    progressFill = document.getElementById('progressFill');
    progressLabel = document.getElementById('progressLabel');
    mascotBubbleText = document.getElementById('mascotText');
    backBtn = document.getElementById('backBtn');
    nextBtn = document.getElementById('nextBtn');

    backBtn.addEventListener('click', goBack);
    nextBtn.addEventListener('click', goNext);

    var muteBtn = document.getElementById('muteBtn');
    if (muteBtn) {
      muteBtn.addEventListener('click', function () {
        SoundFX.setEnabled(!SoundFX.isEnabled());
        muteBtn.classList.toggle('is-muted', !SoundFX.isEnabled());
        muteBtn.setAttribute('aria-label', SoundFX.isEnabled() ? 'Выключить звук' : 'Включить звук');
      });
    }

    var mascotBtn = document.getElementById('mascotAvatar');
    if (mascotBtn) {
      mascotBtn.addEventListener('click', function () {
        mascotBubbleText.textContent = MASCOT_GENERAL[mascotFactIndex % MASCOT_GENERAL.length];
        mascotFactIndex++;
        var bubble = document.getElementById('mascotBubble');
        bubble.classList.remove('pop');
        void bubble.offsetWidth;
        bubble.classList.add('pop');
      });
    }

    renderStep();
  });
})();

</script>
</body>
</html>
